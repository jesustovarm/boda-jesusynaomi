.sede-body h3{font-family:"Cormorant Garamond",serif;font-size:28px;margin-bottom:8px}
.sede-meta{font-size:13px;color:var(--soft);line-height:1.7;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:600;transition:transform .2s}
.btn-primary{background:var(--color-primary);color:white}.btn-primary:hover{transform:translateY(-1px)}
.btn-white{background:white;color:var(--color-primary);border:1px solid var(--border)}
.invitados-wrap{padding:64px 24px;background:var(--bg);display:flex;justify-content:center}
.invitados-card{max-width:640px;width:100%;background:white;border:2px solid var(--color-primary);border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.07)}
.invitados-icon{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:#fffaf6;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px}
.invitados-label{font-size:11px;letter-spacing:0.28em;text-transform:uppercase;opacity:0.6;margin-bottom:8px}
.invitados-nombre{font-family:"Cormorant Garamond",serif;font-size:22px;margin-bottom:6px}
.invitados-text{font-family:"Cormorant Garamond",serif;font-size:22px;line-height:1.2}
.invitados-num{font-family:"Cormorant Garamond",serif;font-size:56px;font-weight:700;color:var(--color-primary);line-height:1;margin:12px 0}
.invitados-sub{margin-top:16px;font-size:12px;opacity:0.6;line-height:1.5;max-width:360px;margin-left:auto;margin-right:auto}
.gallery-wrap{padding:0 16px 72px;max-width:900px;margin:0 auto}
.g-grid{display:grid;gap:12px}
.g-grid.cols-1{grid-template-columns:1fr}
.g-grid.cols-2{grid-template-columns:1fr 1fr}
.g-grid.masonry{column-count:2;column-gap:12px;display:block}
@media(min-width:700px){.g-grid.masonry{column-count:3}}
.g-grid.masonry .g-item{break-inside:avoid;margin-bottom:12px}
.g-item{border-radius:20px;overflow:hidden;background:#fff;border:1px solid var(--border);cursor:pointer;position:relative}
.g-item img{width:100%;height:auto;display:block;transition:transform .6s;object-fit:cover;object-position:center center}
.g-item:hover img{transform:scale(1.03)}
.gifts{padding:72px 28px;background:white;border-top:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center}
.rsvp{padding:84px 28px;text-align:center;background:var(--color-primary);color:white}
.rsvp h2{color:white}.rsvp p{color:rgba(255,255,255,0.85);max-width:460px;margin:12px auto 24px;font-size:15px;line-height:1.7}
.wa-btn{display:inline-flex;align-items:center;gap:10px;background:white;color:var(--color-primary);padding:14px 28px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px}
.enamorame{padding:72px 28px;text-align:center;background:var(--bg)}
.music-card{max-width:520px;margin:24px auto 0;background:white;border:1px solid var(--border);border-radius:20px;padding:20px;display:flex;align-items:center;gap:16px}
.music-btn{width:56px;height:56px;border-radius:50%;background:var(--color-primary);color:white;border:none;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.footer{padding:56px 28px;text-align:center;border-top:1px solid var(--border);background:white}
.footer p{font-family:"Cormorant Garamond",serif;font-size:18px;font-style:italic;color:var(--soft)}
.lightbox{position:fixed;inset:0;background:rgba(20,14,12,0.92);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:.25s}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.4);object-fit:contain;object-position:center}
.lb-close{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.12);color:white;border:1px solid rgba(255,255,255,0.2);font-size:20px;cursor:pointer}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.14);color:white;border:1px solid rgba(255,255,255,0.2);font-size:18px;cursor:pointer}
.lb-prev{left:18px}.lb-next{right:18px}
/* ENVELOPE */
.envelope-overlay{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg, var(--bg) 0%, #ffffff 100%);display:flex;align-items:center;justify-content:center;transition:transform 0.85s cubic-bezier(0.76,0,0.24,1), opacity 0.6s ease}
.envelope-overlay.open{transform:translateY(-100%);opacity:0;pointer-events:none}
.envelope-card{width:min(440px,92vw);background:white;border:1px solid var(--border);border-radius:32px;padding:42px 32px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.12)}
.envelope-card h1{font-family:"Cormorant Garamond",serif;font-size:46px;line-height:0.95}
.envelope-btn{margin-top:28px;width:100%;padding:16px 22px;border-radius:999px;background:var(--color-primary);color:white;border:none;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:0.02em;box-shadow:0 12px 32px rgba(0,0,0,0.18);transition:transform 0.2s}
.envelope-btn:hover{transform:translateY(-1px)}
.envelope-sub{margin-top:14px;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;opacity:0.55}
/* DESIGN VARIANTS */
.design-minimal .hero-frame{border-style:dashed;opacity:0.5}.design-minimal .cd-box{border-radius:8px;box-shadow:none}.design-minimal h2.serif{font-weight:300;letter-spacing:-0.03em}
.design-boho .serif.names{font-family:"Great Vibes",cursive;font-size:clamp(56px,10vw,96px);font-weight:400}.design-boho .hero-frame{border-radius:56px}.design-boho .sede-card,.design-boho .parent-col{border-radius:28px}
.design-jardin .hero-overlay{background:radial-gradient(60% 60% at 50% 30%, rgba(45,74,62,0.18) 0%, rgba(20,30,24,0.58) 100%)}.design-jardin .cd-box{border-color:#cfe0d3}.design-jardin h2.serif{color:#2d4a3e}
@media(max-width:700px){.countdown{gap:8px}.cd-box{min-width:74px;padding:14px 8px}.parents{grid-template-columns:1fr}}
